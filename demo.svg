<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="svgTitle svgDesc">
  <title id="svgTitle">Swarm Rebuild — demo</title>
  <desc id="svgDesc">Kursor-kursor warna-warni membangun kembali sebuah halaman web blok demi blok, seperti efek Swarm Rebuild.</desc>

  <!-- Kanvas gelap -->
  <rect width="800" height="450" fill="#141414"/>

  <!-- Header halaman (muncul 0.4s) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.88;0.96" dur="12s" begin="0.4s" repeatCount="indefinite"/>
    <rect x="70" y="36" width="660" height="42" rx="8" fill="#2e2e2e"/>
    <rect x="86" y="48" width="18" height="18" rx="4" fill="#0d99ff"/>
    <rect x="120" y="52" width="34" height="10" rx="5" fill="#4a4a4a"/>
    <rect x="170" y="52" width="34" height="10" rx="5" fill="#4a4a4a"/>
    <rect x="220" y="52" width="34" height="10" rx="5" fill="#4a4a4a"/>
    <rect x="620" y="50" width="90" height="14" rx="7" fill="#222222" stroke="#444444"/>
  </g>

  <!-- Hero biru (muncul 1.4s) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.88;0.96" dur="12s" begin="1.4s" repeatCount="indefinite"/>
    <rect x="70" y="94" width="660" height="118" rx="10" fill="#0d99ff"/>
    <rect x="100" y="120" width="300" height="16" rx="4" fill="#ffffff" opacity="0.9"/>
    <rect x="100" y="148" width="420" height="10" rx="4" fill="#ffffff" opacity="0.55"/>
    <rect x="100" y="166" width="340" height="10" rx="4" fill="#ffffff" opacity="0.55"/>
    <rect x="100" y="188" width="90" height="16" rx="8" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Kartu A (muncul 2.6s) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.88;0.96" dur="12s" begin="2.6s" repeatCount="indefinite"/>
    <rect x="70" y="230" width="322" height="104" rx="10" fill="#333333"/>
    <rect x="90" y="250" width="140" height="12" rx="4" fill="#888888"/>
    <rect x="90" y="272" width="280" height="9" rx="4" fill="#4a4a4a"/>
    <rect x="90" y="288" width="240" height="9" rx="4" fill="#4a4a4a"/>
    <rect x="90" y="304" width="180" height="9" rx="4" fill="#4a4a4a"/>
  </g>

  <!-- Kartu B (muncul 3.6s) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.88;0.96" dur="12s" begin="3.6s" repeatCount="indefinite"/>
    <rect x="408" y="230" width="322" height="104" rx="10" fill="#333333"/>
    <rect x="428" y="250" width="140" height="12" rx="4" fill="#888888"/>
    <rect x="428" y="272" width="280" height="9" rx="4" fill="#4a4a4a"/>
    <rect x="428" y="288" width="240" height="9" rx="4" fill="#4a4a4a"/>
    <rect x="428" y="304" width="180" height="9" rx="4" fill="#4a4a4a"/>
  </g>

  <!-- Strip bawah (muncul 4.6s) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.88;0.96" dur="12s" begin="4.6s" repeatCount="indefinite"/>
    <rect x="70" y="348" width="660" height="44" rx="8" fill="#262626"/>
    <rect x="90" y="364" width="500" height="10" rx="4" fill="#3a3a3a"/>
    <rect x="90" y="380" width="380" height="10" rx="4" fill="#3a3a3a"/>
  </g>

  <!-- Bar bawah ala HUD (muncul 0.2s) -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.04;0.88;0.96" dur="12s" begin="0.2s" repeatCount="indefinite"/>
    <rect x="200" y="408" width="400" height="30" rx="15" fill="#1e1e1e" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="222" cy="423" r="7" fill="#ff5a5a"/>
    <circle cx="236" cy="423" r="7" fill="#ffc93c"/>
    <circle cx="250" cy="423" r="7" fill="#3ddc84"/>
    <text x="265" y="427" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#cfcfcf">48 / 156 layers</text>
    <rect x="365" y="421" width="80" height="4" rx="2" fill="#3a3a3a"/>
    <rect x="365" y="421" width="0" height="4" rx="2" fill="#0d99ff">
      <animate attributeName="width" values="0;80;80;0" keyTimes="0;0.6;0.9;1" dur="12s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="455" y="414" width="44" height="18" rx="9" fill="#2c2c2c"/>
    <text x="477" y="427" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#ffffff">Tour</text>
    <rect x="505" y="414" width="44" height="18" rx="9" fill="#2c2c2c"/>
    <text x="527" y="427" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#ffffff">1x</text>
  </g>

  <!-- Kursor 1 merah -> header -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="12s" begin="0.3s" repeatCount="indefinite"/>
    <animateMotion dur="1.2s" begin="0.5s" fill="freeze" path="M400,470 L120,57"/>
    <g transform="scale(1.6)">
      <polygon points="0,0 0,17 5,12.5 7.5,19 10,17.5 7.5,11 13,11" fill="#ff5a5a" stroke="#ffffff" stroke-width="1"/>
    </g>
  </g>

  <!-- Kursor 2 kuning -> hero -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="12s" begin="0.3s" repeatCount="indefinite"/>
    <animateMotion dur="1.4s" begin="1.5s" fill="freeze" path="M90,470 L400,150"/>
    <g transform="scale(1.6)">
      <polygon points="0,0 0,17 5,12.5 7.5,19 10,17.5 7.5,11 13,11" fill="#ffc93c" stroke="#ffffff" stroke-width="1"/>
    </g>
  </g>

  <!-- Kursor 3 hijau -> kartu A -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="12s" begin="0.3s" repeatCount="indefinite"/>
    <animateMotion dur="1.4s" begin="2.7s" fill="freeze" path="M720,60 L150,280"/>
    <g transform="scale(1.6)">
      <polygon points="0,0 0,17 5,12.5 7.5,19 10,17.5 7.5,11 13,11" fill="#3ddc84" stroke="#ffffff" stroke-width="1"/>
    </g>
  </g>

  <!-- Kursor 4 ungu -> kartu B -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="12s" begin="0.3s" repeatCount="indefinite"/>
    <animateMotion dur="1.4s" begin="3.7s" fill="freeze" path="M40,430 L480,280"/>
    <g transform="scale(1.6)">
      <polygon points="0,0 0,17 5,12.5 7.5,19 10,17.5 7.5,11 13,11" fill="#b388ff" stroke="#ffffff" stroke-width="1"/>
    </g>
  </g>

  <!-- Kursor 5 biru -> strip bawah -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.9;1" dur="12s" begin="0.3s" repeatCount="indefinite"/>
    <animateMotion dur="1.3s" begin="4.7s" fill="freeze" path="M760,120 L400,370"/>
    <g transform="scale(1.6)">
      <polygon points="0,0 0,17 5,12.5 7.5,19 10,17.5 7.5,11 13,11" fill="#0d99ff" stroke="#ffffff" stroke-width="1"/>
    </g>
  </g>
</svg>
